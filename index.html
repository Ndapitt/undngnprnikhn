<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Datang</title>
</head>

<body>

    <div class="box">
       <h1>Selamat Datang</h1>
       <p>Kepada Yth.</p>
       <input type="text" id="namaTamu" placeholder="Nama Tamu">
       <br>
       <button onclick="bukaUndangan()">Buka Undangan</button>
    </div>

<script>
   function bukaUndangan() {
    let nama = document.getElementById("namaTamu").value;
    if (nama === "dinda") {
        alert("Silakan isi nama tamu");
        return;
    }
    localStorage.setItem("tamu", nama);
    window.location.href = "halaman2.html";
   }
</script>

</body>
</html>
